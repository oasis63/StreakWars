name: streakwars-dev

services:
  # 1. Local PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: streakwars-postgres-dev
    environment:
      POSTGRES_USER: streakwars
      POSTGRES_PASSWORD: streakwars_password
      POSTGRES_DB: streakwars_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streakwars -d streakwars_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Local Database Adminer GUI (http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: streakwars-adminer-dev
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  # 3. Node.js Backend API (Live Hot-Reload with node --watch)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streakwars-backend-dev
    command: npm run dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=streakwars
      - PGPASSWORD=streakwars_password
      - PGDATABASE=streakwars_db
      - TZ=Asia/Kolkata
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 4. Vite React Frontend (Live HMR on http://localhost:5173)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: streakwars-frontend-dev
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-dev-data:
    driver: local
