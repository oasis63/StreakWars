version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: streakwars-postgres
    environment:
      POSTGRES_USER: streakwars
      POSTGRES_PASSWORD: streakwars_password
      POSTGRES_DB: streakwars_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streakwars -d streakwars_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streakwars-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=streakwars
      - PGPASSWORD=streakwars_password
      - PGDATABASE=streakwars_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streakwars-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
